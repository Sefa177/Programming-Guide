<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyglot Guide - Learn how to use programming languages</title>
  <meta name="description" content="A free, no-install guide that shows how to set up and use popular programming languages: Python, JavaScript, Rust, C, C++, Java, Go, Lua and Assembly.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Toggle language list">&#9776;</button>
    <a class="brand" href="#/">Polyglot<span>Guide</span></a>
    <input id="search" class="search" type="search" placeholder="Search lessons...  (press / )" aria-label="Search lessons" autocomplete="off">
    <a class="pill-link" href="#/compare/hello">Compare</a>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch light or dark theme">&#9788;</button>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Languages"></nav>
    <main id="main" class="main"></main>
  </div>

  <footer class="footer">
    Polyglot Guide is open source. Found a mistake or want another language? Open an issue or a pull request.
  </footer>

  <script src="js/data/python.js"></script>
  <script src="js/data/javascript.js"></script>
  <script src="js/data/rust.js"></script>
  <script src="js/data/c.js"></script>
  <script src="js/data/cpp.js"></script>
  <script src="js/data/java.js"></script>
  <script src="js/data/go.js"></script>
  <script src="js/data/lua.js"></script>
  <script src="js/data/assembly.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
